plugins {
    id 'org.springframework.boot' version '4.0.6' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.google.cloud.tools.jib' version '3.4.2' apply false
}

subprojects {
    ext {
        resilience4jVersion = "2.2.0"
    }
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    group = 'org.bk'
    version = '0.0.4-SNAPSHOT'
    dependencies {
        implementation("io.github.resilience4j:resilience4j-timelimiter:${property("resilience4jVersion")}")
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        testImplementation 'io.projectreactor:reactor-test'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

configure([project(':sample-caller'), project(':sample-producer')]) {
    apply plugin: 'org.springframework.boot'
    apply plugin: 'com.google.cloud.tools.jib'

    dependencies {
        implementation(project(":common"))
        implementation('org.springframework.boot:spring-boot-starter-actuator')
        implementation('io.micrometer:micrometer-tracing-bridge-otel')
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    }

    bootRun {
        args = ["--spring.profiles.active=local"]
    }
    jib {
        from {
            image = 'cgr.dev/chainguard/jre:latest'
        }
    }
}


configure([project(':common')]) {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    group = 'org.bk'
    version = '0.0.2-SNAPSHOT'

    dependencies {
        api("org.springframework.boot:spring-boot-starter-webflux")
        api("org.springframework.boot:spring-boot-starter-webclient")
        api("tools.jackson.core:jackson-databind")
        implementation('com.github.ben-manes.caffeine:caffeine:3.1.6')
        testImplementation('org.springframework.boot:spring-boot-starter-test')
        testImplementation('io.projectreactor:reactor-test')
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }
}
